<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>My English AI Coach</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="English Coach">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0b1222;
      --panel: #111b30;
      --card: #1a2740;
      --border: #2a3a58;
      --accent: #3b82f6;
      --accent-2: #6366f1;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #9fb0c9;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #16254a 0%, var(--bg) 60%);
      color: var(--text);
    }

    /* ---------- cadre de l'appli ---------- */
    .app {
      max-width: 780px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      overflow: hidden;
    }
    @media (min-width: 820px) {
      .hero { min-height: 220px; }
      .app {
        height: calc(100dvh - 2rem);
        margin: 1rem auto;
        border-radius: 22px;
        border: 1px solid var(--border);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      }
    }

    /* ---------- bandeau : photo de couverture, logo, horloge ---------- */
    .hero {
      position: relative;
      flex: none;
      min-height: 196px;
      padding: max(0.85rem, env(safe-area-inset-top)) 1rem 0.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      overflow: hidden;
      isolation: isolate;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: var(--cover, none), linear-gradient(135deg, #1e3a8a, #312e81);
      background-size: cover;
      background-position: center;
    }
    .hero-shade {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(11, 18, 34, 0.45) 0%, rgba(11, 18, 34, 0.10) 38%, rgba(17, 27, 48, 0.92) 100%);
    }
    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .brand { display: flex; align-items: center; gap: 0.65rem; min-width: 0; }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      object-fit: cover;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      flex: none;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.15;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }
    .brand p { margin: 0.15rem 0 0; font-size: 0.75rem; opacity: 0.9; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }

    .clock { text-align: right; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65); flex: none; }
    .clock-time {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    .clock-sec { font-size: 0.95rem; font-weight: 600; opacity: 0.8; margin-left: 0.2rem; }
    .clock-date { margin-top: 0.3rem; font-size: 0.78rem; opacity: 0.95; }

    .hero-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 1.4rem;
    }
    .hero-tag { font-size: 0.82rem; opacity: 0.92; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); }
    .hero-actions { display: flex; gap: 0.4rem; flex: none; }
    .chip-btn {
      padding: 0.35rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      background: rgba(11, 18, 34, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* ---------- barre de réglages ---------- */
    .toolbar {
      flex: none;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 0.6rem;
      padding: 0.6rem 0.9rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .toolbar label { display: flex; align-items: center; gap: 0.35rem; }
    .toolbar .spacer { flex: 1; }
    select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.4rem 0.6rem;
      font-size: 0.82rem;
    }
    .ghost {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      font-size: 0.85rem;
    }

    /* ---------- conversation ---------- */
    #chat-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      scroll-behavior: smooth;
    }
    .message {
      padding: 0.85rem 1rem;
      border-radius: 16px;
      max-width: 90%;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      animation: pop 0.2s ease-out;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-bottom-right-radius: 5px;
    }
    .ai {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }
    .section-title {
      margin-top: 0.7rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .section-title:first-child { margin-top: 0; }
    .replay {
      margin-top: 0.7rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
    }
    .typing { color: var(--muted); font-style: italic; }

    /* ---------- saisie ---------- */
    #status { flex: none; min-height: 1.2rem; padding: 0 1rem 0.3rem; font-size: 0.82rem; color: #fca5a5; }
    .controls {
      flex: none;
      display: flex;
      gap: 0.4rem;
      padding: 0.6rem 0.8rem;
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0.75rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: #fff;
      font-size: 1rem;
    }
    input[type="text"]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      padding: 0.7rem 1rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.mic, button.lang { background: var(--card); border: 1px solid var(--border); padding: 0.7rem 0.8rem; }
    button.lang { padding: 0.7rem 0.65rem; font-size: 0.85rem; }
    button.mic.on { background: var(--danger); border-color: var(--danger); animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.6; } }

    @media (max-width: 380px) {
      .clock-time { font-size: 1.6rem; }
      .brand h1 { font-size: 0.98rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; scroll-behavior: auto !important; }
    }

    /* ---------- menu : réglages + historique ---------- */
    #chat-container { font-size: var(--fs, 1rem); }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; }
    .drawer {
      position: fixed; top: 0; bottom: 0; right: 0; z-index: 41;
      width: min(92vw, 400px); background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .overlay[hidden], .drawer[hidden] { display: none; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); font-weight: 700; }
    .tabs { display: flex; gap: 0.4rem; padding: 0.6rem 1rem 0; }
    .tab { flex: 1; background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 0.55rem; font-size: 0.88rem; }
    .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pane { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.9rem; }
    .pane[hidden] { display: none; }
    .field { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.85rem; color: var(--muted); }
    .field.row { flex-direction: row; align-items: center; gap: 0.5rem; }
    .field select { width: 100%; padding: 0.55rem 0.6rem; }
    .btn-line { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .danger { color: #fca5a5; }
    .hist-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.7rem 0.8rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .hist-title { font-size: 0.9rem; overflow-wrap: anywhere; }
    .hist-meta { font-size: 0.75rem; color: var(--muted); }
    .empty { color: var(--muted); font-size: 0.88rem; text-align: center; padding: 1.5rem 0; }

    /* ---------- look v3 : plus soigné ---------- */
    .toolbar {
      background: linear-gradient(180deg, rgba(26,39,64,0.9), rgba(17,27,48,0.9));
      gap: 0.5rem; padding: 0.65rem 0.9rem; flex-wrap: nowrap;
    }
    .toolbar select { min-width: 0; flex: 0 1 auto; max-width: 42vw; }
    .pill {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 0.5rem 0.9rem; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; white-space: nowrap;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .pill:active { transform: scale(0.96); }
    .pill:hover { filter: brightness(1.15); }
    .pill.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(59,130,246,0.35); }
    .pill.danger { color: #fca5a5; border-color: rgba(239,68,68,0.45); }
    .drawer { background: linear-gradient(180deg, #14203a, #0d1730); box-shadow: -20px 0 50px rgba(0,0,0,0.5); }
    .drawer-head { font-size: 1.05rem; background: linear-gradient(135deg, rgba(59,130,246,0.25), rgba(99,102,241,0.25)); }
    .tabs { padding-bottom: 0.2rem; }
    .tab { border-radius: 999px; font-weight: 600; }
    .tab.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 4px 14px rgba(59,130,246,0.35); }
    .card { background: rgba(26,39,64,0.75); border: 1px solid var(--border); border-radius: 16px; padding: 0.9rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .card h3 { margin: 0; font-size: 0.95rem; }
    .cover-preview { height: 110px; border-radius: 12px; border: 1px solid var(--border); background: #1a2740 center / cover no-repeat; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; font-size: 0.88rem; }
    .switch input { appearance: none; -webkit-appearance: none; flex: none; width: 46px; height: 26px; border-radius: 999px; background: #33425f; position: relative; cursor: pointer; transition: background 0.2s; }
    .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
    .switch input:checked { background: var(--accent); }
    .switch input:checked::after { transform: translateX(20px); }
    .hist-item { border-radius: 14px; background: rgba(26,39,64,0.75); }
  </style>
</head>
<body>
  <div class="app">

    <header class="hero" id="hero">
      <div class="hero-bg"></div>
      <div class="hero-shade"></div>

      <div class="hero-top">
        <div class="brand">
          <img id="logo" src="assets/logo.png" alt="Logo" onerror="this.onerror=null;this.src='icon.svg'">
          <div>
            <h1>English Coach AI</h1>
            <p>Votre coach d'anglais</p>
          </div>
        </div>
        <div class="clock" aria-live="off">
          <div><span class="clock-time" id="clockTime">--:--</span><span class="clock-sec" id="clockSec">--</span></div>
          <div class="clock-date" id="clockDate">&nbsp;</div>
        </div>
      </div>

      <div class="hero-bottom">
        <div class="hero-tag">Parlez · Écoutez · Progressez</div>
      </div>
    </header>

    <div class="toolbar">
      <select id="levelSelect" aria-label="Niveau d'anglais">
        <option value="A1">A1 · Débutant</option>
        <option value="A2">A2 · Élémentaire</option>
        <option value="B1">B1 · Intermédiaire</option>
        <option value="B2">B2 · Avancé</option>
        <option value="C1">C1 · Autonome</option>
      </select>
      <select id="providerSelect" aria-label="Fournisseur d'IA">
        <option value="claude">IA : Claude</option>
        <option value="gemini">IA : Gemini (gratuit)</option>
      </select>
      <span class="spacer"></span>
      <button id="newBtn" class="pill" title="Nouvelle conversation (l'actuelle est gardée dans l'historique)">＋ Nouvelle</button>
      <button id="menuBtn" class="pill primary" title="Réglages et historique" aria-label="Menu">☰</button>
    </div>

    <div id="chat-container" aria-live="polite"></div>
    <div id="status" role="status"></div>

    <div class="controls">
      <button id="langBtn" class="lang" title="Langue de la dictée">EN</button>
      <button id="micBtn" class="mic" title="Parler au micro">🎙️</button>
      <input type="text" id="userInput" maxlength="800" autocomplete="off"
             placeholder="Répondez en anglais ou en français..." />
      <button id="sendBtn">Envoyer</button>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Menu">
    <div class="drawer-head"><span>Menu</span><button id="closeMenu" class="ghost" aria-label="Fermer">✕</button></div>
    <div class="tabs">
      <button class="tab on" id="tabSet">⚙️ Réglages</button>
      <button class="tab" id="tabHist">🕘 Historique</button>
    </div>

    <div class="pane" id="paneSet">
      <section class="card">
        <h3>🖼️ Photo de la bannière</h3>
        <div class="cover-preview" id="coverPreview"></div>
        <div class="btn-line">
          <button class="pill primary" id="coverBtn">📷 Choisir une photo</button>
          <button class="pill" id="coverResetBtn">↺ Par défaut</button>
        </div>
        <input type="file" id="coverInput" accept="image/*" hidden>
      </section>

      <section class="card">
        <h3>🎓 Apprentissage</h3>
        <label class="field">Taille du texte
          <select id="fontSelect">
            <option value="0.9">Petit</option>
            <option value="1">Normal</option>
            <option value="1.15">Grand</option>
            <option value="1.3">Très grand</option>
          </select>
        </label>
        <label class="switch"><span>🔊 Lire les réponses à voix haute</span><input type="checkbox" id="speakToggle"></label>
        <label class="switch"><span>🎙️ Dictée : envoi automatique</span><input type="checkbox" id="autoSend"></label>
      </section>

      <section class="card">
        <h3>🧹 Données</h3>
        <div class="btn-line">
          <button id="clearBtn" class="pill danger">Effacer la conversation</button>
          <button id="clearAllBtn" class="pill danger">Effacer l'historique</button>
        </div>
      </section>
    </div>

    <div class="pane" id="paneHist" hidden></div>
  </aside>

  <script>
    // ============ CONFIGURATION ============
    // URL de votre Cloudflare Worker (voir README.md)
    const WORKER_URL = "https://votre-worker.workers.dev/chat";

    // Photo de couverture par défaut : remplacez le fichier assets/cover.jpg par la vôtre.
    const DEFAULT_COVER = "assets/cover.jpg";

    const MAX_HISTORY_SENT = 16;   // nombre de messages envoyés au serveur
    const MAX_HISTORY_STORED = 60; // nombre de messages gardés sur l'appareil
    const MAX_INPUT = 800;
    const MAX_ARCHIVE = 20;      // conversations gardées dans l'historique
    const REQUEST_TIMEOUT_MS = 30000;
    const STORAGE_KEY = 'englishCoach.v2';
    const COVER_KEY = 'englishCoach.cover';
    const LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1'];
    const PROVIDERS = ['claude', 'gemini'];

    const GREETING = [
      "[ENGLISH]",
      "Hello! I am your AI English coach. Ready to practice today? What project are you working on right now?",
      "[TRADUCTION]",
      "Bonjour ! Je suis votre coach d'anglais. Prêt à pratiquer aujourd'hui ? Sur quel projet travaillez-vous en ce moment ?"
    ].join("\n");

    const TAG_LABELS = {
      'ENGLISH': '🇬🇧 Anglais',
      'PHONETIQUE': '🔊 Prononciation',
      'TRADUCTION': '🇫🇷 Traduction',
      'FEEDBACK & CORRECTION': '💡 Conseil & Correction'
    };

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const langBtn = document.getElementById('langBtn');
    const levelSelect = document.getElementById('levelSelect');
    const providerSelect = document.getElementById('providerSelect');
    const clearBtn = document.getElementById('clearBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const menuBtn = document.getElementById('menuBtn');
    const newBtn = document.getElementById('newBtn');
    const closeMenu = document.getElementById('closeMenu');
    const overlay = document.getElementById('overlay');
    const drawer = document.getElementById('drawer');
    const tabSet = document.getElementById('tabSet');
    const tabHist = document.getElementById('tabHist');
    const paneSet = document.getElementById('paneSet');
    const paneHist = document.getElementById('paneHist');
    const fontSelect = document.getElementById('fontSelect');
    const speakToggle = document.getElementById('speakToggle');
    const autoSend = document.getElementById('autoSend');
    const statusEl = document.getElementById('status');
    const hero = document.getElementById('hero');
    const coverBtn = document.getElementById('coverBtn');
    const coverResetBtn = document.getElementById('coverResetBtn');
    const coverInput = document.getElementById('coverInput');
    const coverPreview = document.getElementById('coverPreview');

    let busy = false;

    function setStatus(msg) { statusEl.textContent = msg || ''; }

    // ============ HORLOGE + DATE ============
    const timeFmt = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit', hour12: false });
    const dateFmt = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const clockTime = document.getElementById('clockTime');
    const clockSec = document.getElementById('clockSec');
    const clockDate = document.getElementById('clockDate');

    function tickClock() {
      const now = new Date();
      clockTime.textContent = timeFmt.format(now);
      clockSec.textContent = String(now.getSeconds()).padStart(2, '0');
      const d = dateFmt.format(now);
      const pretty = d.charAt(0).toUpperCase() + d.slice(1);
      if (clockDate.textContent !== pretty) clockDate.textContent = pretty;
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ============ PHOTO DE COUVERTURE ============
    function applyCover(src) {
      hero.style.setProperty('--cover', 'url("' + src + '")');
      coverPreview.style.backgroundImage = 'url("' + src + '")';
    }

    function loadCover() {
      let saved = null;
      try { saved = localStorage.getItem(COVER_KEY); } catch (e) { /* stockage indisponible */ }
      applyCover(saved || DEFAULT_COVER);
    }

    // Réduit la photo choisie (1200 px max) avant de la garder sur l'appareil.
    function setCoverFromFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        setStatus("Ce fichier n'est pas une image.");
        return;
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, 1200 / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        const data = canvas.toDataURL('image/jpeg', 0.82);
        applyCover(data);
        try {
          localStorage.setItem(COVER_KEY, data);
          setStatus('');
        } catch (e) {
          setStatus("Photo affichée, mais trop lourde pour être gardée après fermeture.");
        }
      };
      img.onerror = () => { URL.revokeObjectURL(url); setStatus("Impossible de lire cette image."); };
      img.src = url;
    }

    coverBtn.onclick = () => coverInput.click();
    coverInput.onchange = () => { setCoverFromFile(coverInput.files[0]); coverInput.value = ''; };
    coverResetBtn.onclick = () => {
      try { localStorage.removeItem(COVER_KEY); } catch (e) { /* ignoré */ }
      applyCover(DEFAULT_COVER);
      setStatus('');
    };

    // ============ ÉTAT + SAUVEGARDE LOCALE ============
    function loadState() {
      try {
        const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (s && Array.isArray(s.history)) {
          return {
            level: LEVELS.includes(s.level) ? s.level : 'A2',
            provider: PROVIDERS.includes(s.provider) ? s.provider : 'claude',
            autoSend: !!s.autoSend,
            speak: s.speak !== false,
            fontSize: ['0.9', '1', '1.15', '1.3'].includes(String(s.fontSize)) ? String(s.fontSize) : '1',
            archive: Array.isArray(s.archive)
              ? s.archive.filter(c => c && Array.isArray(c.messages) && c.messages.length).slice(0, MAX_ARCHIVE)
              : [],
            history: s.history
              .filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string')
              .slice(-MAX_HISTORY_STORED)
          };
        }
      } catch (e) { /* stockage indisponible */ }
      return { level: 'A2', provider: 'claude', autoSend: false, speak: true, fontSize: '1', archive: [], history: [] };
    }

    function saveState() {
      try {
        state.history = state.history.slice(-MAX_HISTORY_STORED);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) { /* ignoré */ }
    }

    const state = loadState();

    // ============ AFFICHAGE (sans innerHTML : pas de faille XSS) ============
    function parseSections(text) {
      const parts = text.split(/\[(ENGLISH|PHONETIQUE|TRADUCTION|FEEDBACK & CORRECTION)\]/i);
      const sections = [];
      const pre = parts[0].trim();
      if (pre) sections.push({ tag: null, content: pre });
      for (let i = 1; i < parts.length; i += 2) {
        const content = (parts[i + 1] || '').trim();
        if (content) sections.push({ tag: parts[i].toUpperCase(), content });
      }
      return sections;
    }

    function renderMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);

      if (sender === 'user') {
        msgDiv.textContent = text;
      } else {
        const sections = parseSections(text);
        sections.forEach(sec => {
          if (sec.tag) {
            const title = document.createElement('div');
            title.className = 'section-title';
            title.textContent = TAG_LABELS[sec.tag] || sec.tag;
            msgDiv.appendChild(title);
          }
          const body = document.createElement('div');
          body.textContent = sec.content;
          msgDiv.appendChild(body);
        });

        const english = getEnglishPart(text);
        if (english) {
          const replay = document.createElement('button');
          replay.className = 'replay';
          replay.textContent = '🔊 Réécouter';
          replay.onclick = () => speakText(english);
          msgDiv.appendChild(replay);
        }
      }

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'message ai typing';
      div.textContent = 'Le coach écrit…';
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    function renderAll() {
      chatContainer.innerHTML = '';
      renderMessage('ai', GREETING);
      state.history.forEach(m => renderMessage(m.role === 'user' ? 'user' : 'ai', m.content));
    }

    // ============ SYNTHÈSE VOCALE ============
    function getEnglishPart(text) {
      const sec = parseSections(text).find(s => s.tag === 'ENGLISH');
      return sec ? sec.content : '';
    }

    function speakText(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      const voice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
      if (voice) utterance.voice = voice;
      window.speechSynthesis.speak(utterance);
    }

    // ============ RECONNAISSANCE VOCALE ============
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let micLang = 'en-US';

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => { micBtn.classList.add('on'); setStatus(''); };
      recognition.onend = () => micBtn.classList.remove('on');
      recognition.onerror = (e) => {
        micBtn.classList.remove('on');
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          setStatus("Autorisez l'accès au micro dans votre navigateur.");
        } else if (e.error === 'no-speech') {
          setStatus("Je n'ai rien entendu, réessayez.");
        } else if (e.error !== 'aborted') {
          setStatus('Erreur du micro : ' + e.error);
        }
      };
      recognition.onresult = (event) => {
        userInput.value = event.results[0][0].transcript;
        if (autoSend.checked) sendMessage();
      };

      micBtn.onclick = () => {
        if (micBtn.classList.contains('on')) { recognition.stop(); return; }
        window.speechSynthesis && window.speechSynthesis.cancel();
        recognition.lang = micLang;
        try { recognition.start(); } catch (e) { /* déjà démarré */ }
      };

      langBtn.onclick = () => {
        micLang = micLang === 'en-US' ? 'fr-FR' : 'en-US';
        langBtn.textContent = micLang === 'en-US' ? 'EN' : 'FR';
      };
    } else {
      micBtn.style.display = 'none';
      langBtn.style.display = 'none';
      autoSend.parentElement.style.display = 'none';
    }

    // ============ ENVOI ============
    function setBusy(value) {
      busy = value;
      sendBtn.disabled = value;
      userInput.disabled = value;
      if (!value) userInput.focus();
    }

    function payloadHistory() {
      const trimmed = state.history.slice(-MAX_HISTORY_SENT);
      while (trimmed.length && trimmed[0].role !== 'user') trimmed.shift();
      return trimmed;
    }

    async function sendMessage() {
      if (busy) return;
      const text = userInput.value.trim().slice(0, MAX_INPUT);
      if (!text) return;

      if (WORKER_URL.includes('votre-worker')) {
        setStatus("Configurez d'abord WORKER_URL dans index.html (voir README.md).");
        return;
      }

      setStatus('');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      const userBubble = renderMessage('user', text);
      userInput.value = '';
      state.history.push({ role: 'user', content: text });
      setBusy(true);
      const typing = showTyping();

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: payloadHistory(), level: state.level, provider: state.provider }),
          signal: controller.signal
        });

        let data = null;
        try { data = await response.json(); } catch (e) { /* réponse non JSON */ }
        if (!response.ok || !data || typeof data.reply !== 'string') {
          throw new Error((data && data.error) || ('Erreur serveur (' + response.status + ')'));
        }

        state.history.push({ role: 'assistant', content: data.reply });
        saveState();
        typing.remove();
        renderMessage('ai', data.reply);
        if (state.speak) speakText(getEnglishPart(data.reply));

      } catch (err) {
        typing.remove();
        // On annule l'envoi : le message revient dans la zone de saisie.
        state.history.pop();
        userBubble.remove();
        userInput.value = text;
        setStatus(err.name === 'AbortError'
          ? 'Le serveur met trop de temps à répondre. Réessayez.'
          : (err.message || 'Erreur de connexion au serveur.'));
        console.error(err);
      } finally {
        clearTimeout(timer);
        setBusy(false);
      }
    }

    // ============ ÉVÉNEMENTS ============
    sendBtn.onclick = sendMessage;
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    levelSelect.onchange = () => { state.level = levelSelect.value; saveState(); };
    providerSelect.onchange = () => { state.provider = providerSelect.value; saveState(); setStatus(''); };
    autoSend.onchange = () => { state.autoSend = autoSend.checked; saveState(); };
    clearBtn.onclick = () => {
      if (!confirm('Effacer toute la conversation ?')) return;
      state.history = [];
      saveState();
      setStatus('');
      renderAll();
    };

    // ============ MENU + HISTORIQUE ============
    const histFmt = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

    function openMenu(tab) {
      overlay.hidden = false; drawer.hidden = false;
      showTab(tab || 'set');
    }
    function closeDrawer() { overlay.hidden = true; drawer.hidden = true; }
    function showTab(name) {
      const hist = name === 'hist';
      paneSet.hidden = hist; paneHist.hidden = !hist;
      tabSet.classList.toggle('on', !hist); tabHist.classList.toggle('on', hist);
      if (hist) renderHistory();
    }

    function hasUserMessage(list) { return list.some(m => m.role === 'user'); }

    // Range la conversation en cours dans l'historique (si elle contient quelque chose).
    function archiveCurrent() {
      if (!hasUserMessage(state.history)) return;
      const first = state.history.find(m => m.role === 'user').content;
      state.archive.unshift({
        id: Date.now(),
        date: Date.now(),
        title: first.length > 60 ? first.slice(0, 60) + '…' : first,
        messages: state.history.slice()
      });
      state.archive = state.archive.slice(0, MAX_ARCHIVE);
    }

    function applyFont() { chatContainer.style.setProperty('--fs', state.fontSize + 'rem'); }

    function renderHistory() {
      paneHist.innerHTML = '';
      if (!state.archive.length) {
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = "Aucune conversation enregistrée. Touchez « Nouvelle » pour ranger la conversation en cours ici.";
        paneHist.appendChild(e);
        return;
      }
      state.archive.forEach(c => {
        const item = document.createElement('div'); item.className = 'hist-item';
        const t = document.createElement('div'); t.className = 'hist-title'; t.textContent = c.title || 'Conversation';
        const m = document.createElement('div'); m.className = 'hist-meta';
        m.textContent = histFmt.format(new Date(c.date)) + ' · ' + c.messages.length + ' messages';
        const row = document.createElement('div'); row.className = 'btn-line';
        const open = document.createElement('button'); open.className = 'ghost'; open.textContent = '↩︎ Reprendre';
        open.onclick = () => resumeConversation(c.id);
        const del = document.createElement('button'); del.className = 'ghost danger'; del.textContent = '🗑️';
        del.onclick = () => {
          if (!confirm('Supprimer cette conversation ?')) return;
          state.archive = state.archive.filter(x => x.id !== c.id);
          saveState(); renderHistory();
        };
        row.append(open, del);
        item.append(t, m, row);
        paneHist.appendChild(item);
      });
    }

    function resumeConversation(id) {
      if (busy) return;
      const c = state.archive.find(x => x.id === id);
      if (!c) return;
      state.archive = state.archive.filter(x => x.id !== id);
      archiveCurrent();
      state.history = c.messages.slice();
      saveState(); setStatus(''); renderAll(); closeDrawer();
    }

    function newConversation() {
      if (busy) return;
      if (!hasUserMessage(state.history)) { setStatus(''); return; }
      archiveCurrent();
      state.history = [];
      saveState(); setStatus(''); renderAll();
    }

    menuBtn.onclick = () => openMenu('set');
    closeMenu.onclick = closeDrawer;
    overlay.onclick = closeDrawer;
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
    tabSet.onclick = () => showTab('set');
    tabHist.onclick = () => showTab('hist');
    newBtn.onclick = newConversation;
    fontSelect.onchange = () => { state.fontSize = fontSelect.value; applyFont(); saveState(); };
    speakToggle.onchange = () => {
      state.speak = speakToggle.checked; saveState();
      if (!state.speak && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    };
    clearAllBtn.onclick = () => {
      if (!confirm("Effacer tout l'historique des conversations enregistrées ?")) return;
      state.archive = []; saveState(); renderHistory();
    };

    // ============ DÉMARRAGE ============
    levelSelect.value = state.level;
    providerSelect.value = state.provider;
    autoSend.checked = state.autoSend;
    speakToggle.checked = state.speak;
    fontSelect.value = state.fontSize;
    applyFont();
    loadCover();
    renderAll();

    if ('speechSynthesis' in window) window.speechSynthesis.getVoices(); // précharge les voix

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
